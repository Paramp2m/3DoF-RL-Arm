# Phase 4 E1: e1_delta_pos with action_mode torque_gravcomp (only change).
name: e1_torque_gravcomp
task: reach
env:
  action_mode: torque_gravcomp
  max_delta: 0.05
  frame_skip: 20
  episode_steps: 200
  success_dist: 0.02
  vel_scale: 0.1
  vel_clip: 5.0
  obs_err: false
  reward: {w_distance: 0.0, w_precision: 1.0, sigma: 0.03, w_success: 1.0, w_limit: 0.5, limit_margin: 0.05}
arm:
  xml: models/arm/arm.xml
  actuators: position
  kp: 400.0
  kv: 20.0
  tau_max: 12.0
  joint_damping: 0.5
  frictionloss: 0.0
  armature: 0.01
  body_mass: {shoulder: 0.8, upper_arm: 1.0, forearm: 0.6}
  home: [0.0, 1.0, -0.5]
algo:
  name: SAC
  policy: MultiInputPolicy
  kwargs:
    learning_rate: 0.001
    batch_size: 256
    buffer_size: 300000
    learning_starts: 5000
    gamma: 0.98
    policy_kwargs:
      features_extractor_class: GoalDiffExtractor
      features_extractor_kwargs: {scale: 30.0}
total_steps: 300000
val: {every: 20000, episodes: 100, seed: 50000}   # learning curves (val.json) + val-best model.zip
seed: 0
torch_threads: 1
eval_episodes: 100
gif_episodes: 3
dry_steps: 6000
dry_eval_episodes: 5

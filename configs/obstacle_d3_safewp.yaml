# Phase 5 obstacle d3: d1 + d2 (safe filter and planner waypoint), plain SAC.
name: obstacle_d3_safewp
task: obstacle
env:
  action_mode: delta_pos
  max_delta: 0.05
  frame_skip: 20
  episode_steps: 300
  obs_box_yaw: true
  obs_clearance: true
  clear_margin: 0.04
  start_clearance: 0.05
  box_half: [0.04, 0.1, 0.1]
  min_span: 0.2
  success_dist: 0.02
  vel_scale: 0.1
  vel_clip: 5.0
  obs_err: false
  reward: {w_distance: 0.0, w_precision: 1.0, sigma: 0.03, w_success: 1.0, w_limit: 0.5,
    w_collision: 1.0, w_smooth: 0.2, w_clear: 0.3, limit_margin: 0.05, w_wp: 0.3}
  obs_waypoint: true
  safe_action: true
arm:
  xml: models/arm/arm_obstacle.xml
  actuators: position
  kp: 400.0
  kv: 20.0
  tau_max: 12.0
  joint_damping: 0.5
  frictionloss: 0.0
  armature: 0.01
  body_mass: {shoulder: 0.8, upper_arm: 1.0, forearm: 0.6}
  home: [0.0, 1.0, -0.5]
algo:
  name: SAC
  policy: MultiInputPolicy
  kwargs:
    learning_rate: 0.001
    batch_size: 256
    buffer_size: 1000000
    learning_starts: 5000
    gamma: 0.98
    policy_kwargs:
      features_extractor_class: GoalDiffExtractor
      features_extractor_kwargs: {scale: 30.0}
total_steps: 1000000
val: {every: 50000, episodes: 100, seed: 50000, clean: true, early_stop: {min_frac: 0.3, min_points: 5, patience: 6, delta: 0.01, floor: 0.45}}
seed: 0
torch_threads: 2
eval_episodes: 100
gif_episodes: 3
dry_steps: 6000
dry_eval_episodes: 5

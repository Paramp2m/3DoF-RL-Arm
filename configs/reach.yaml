# Phase 2: goal-conditioned reach env (no training yet). Action mode picks the actuator set.
name: reach
task: reach
env:
  action_mode: delta_pos   # delta_pos | abs_pos | torque | torque_gravcomp
  max_delta: 0.05          # rad per step (delta_pos)
  frame_skip: 20           # 20 x 2 ms = 0.04 s control step (25 Hz)
  episode_steps: 200
  success_dist: 0.02       # m
  vel_scale: 0.1           # obs joint velocity = qvel * vel_scale, clipped to +-vel_clip
  vel_clip: 5.0
  reward: {w_distance: 1.0, w_precision: 1.0, sigma: 0.03, w_success: 1.0}
arm:
  xml: models/arm/arm.xml
  actuators: position      # overridden by env.action_mode
  kp: 400.0
  kv: 20.0
  tau_max: 12.0
  joint_damping: 0.5
  frictionloss: 0.0
  armature: 0.01
  body_mass: {shoulder: 0.8, upper_arm: 1.0, forearm: 0.6}   # kg; inertia scaled with mass
  home: [0.0, 1.0, -0.5]
eval_episodes: 100
gif_episodes: 3
seed: 0
torch_threads: 2

# Phase 3 task A: SAC on goal-conditioned reach (delta_pos). Seeds are passed with --seed.
name: reach_sac_wide
task: reach
env:
  action_mode: delta_pos
  max_delta: 0.05
  frame_skip: 20
  episode_steps: 200
  success_dist: 0.02
  vel_scale: 0.1
  vel_clip: 5.0
  err_scale: 30
  reward: {w_distance: 1.0, w_precision: 1.0, sigma: 0.03, w_success: 1.0}
arm:
  xml: models/arm/arm.xml
  actuators: position
  kp: 400.0
  kv: 20.0
  tau_max: 12.0
  joint_damping: 0.5
  frictionloss: 0.0
  armature: 0.01
  body_mass: {shoulder: 0.8, upper_arm: 1.0, forearm: 0.6}
  home: [0.0, 1.0, -0.5]
algo:
  name: SAC
  policy: MultiInputPolicy
  kwargs: {learning_rate: 0.001, batch_size: 256, buffer_size: 300000, learning_starts: 5000, gamma: 0.98, policy_kwargs: {net_arch: [512, 512, 512]}}
total_steps: 300000
seed: 0
torch_threads: 2
eval_episodes: 100
gif_episodes: 3
dry_steps: 6000
dry_eval_episodes: 5

# Phase 5 task C with the action-change penalty w_smooth (user: no chatter once settled).
# Plain SAC, no HER (a moving target is inconsistent with HER relabelling), shaped reward, target velocity in obs.
name: track_smooth
task: track
env:
  action_mode: delta_pos
  max_delta: 0.05
  frame_skip: 20
  episode_steps: 200
  success_dist: 0.02
  vel_scale: 0.1
  vel_clip: 5.0
  err_scale: 30.0
  radius: 0.08
  period: 8.0
  vel_obs_scale: 10.0
  start_noise: 0.2
  reward: {w_distance: 1.0, w_precision: 1.0, sigma: 0.03, w_success: 1.0, w_limit: 0.5, w_smooth: 0.2, limit_margin: 0.05}
arm:
  xml: models/arm/arm.xml
  actuators: position
  kp: 400.0
  kv: 20.0
  tau_max: 12.0
  joint_damping: 0.5
  frictionloss: 0.0
  armature: 0.01
  body_mass: {shoulder: 0.8, upper_arm: 1.0, forearm: 0.6}
  home: [0.0, 1.0, -0.5]
algo:
  name: SAC
  policy: MultiInputPolicy
  kwargs:
    learning_rate: 0.001
    batch_size: 256
    buffer_size: 1000000
    learning_starts: 5000
    gamma: 0.98
total_steps: 300000
val: {every: 25000, episodes: 50, seed: 50000}   # val-best by success then median distance
seed: 0
torch_threads: 2
eval_episodes: 100
gif_episodes: 3
dry_steps: 6000
dry_eval_episodes: 5

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rl-arm dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2312150C'/><path d='M7 24 L14 15 L22 18 L25 9' stroke='%23C9982F' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='25' cy='9' r='3' fill='%23F5EFE3'/></svg>">
<style>
:root {
  /* palette F5EFE3 4F5B2A B8892D D8C9A8 (colorhunt), stretched darker at the dark end and lighter at the light end */
  --bg: #12150C; --panel: #1A1F11; --panel2: #232A16; --line: #303A21; --line2: #414D2B;
  --olive: #4F5B2A; --muted: #A7A486; --text2: #E2D7BF; --text: #FBF8F1;
  --accent: #C9982F; --accent2: #D8C9A8; --cream: #F5EFE3;
  --good: #A9C27A; --bad: #D9735F; --warn: #E8A54B;
  --s1: #C9982F; --s2: #A9C27A; --s3: #8EB1C1; --s4: #D98C7A; --s5: #F5EFE3;
  --radius: 14px; --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 0.86em; }
code { background: var(--panel2); padding: 1px 6px; border-radius: 6px; color: var(--cream); }
pre { background: #0C0F08; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; color: var(--text2); max-height: 480px; }
pre code { background: none; padding: 0; }
h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 26px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: #0E110A; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand svg { flex: none; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
nav.side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text2); font-weight: 520; }
nav.side a:hover { background: var(--panel); text-decoration: none; }
nav.side a.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
nav.side a .n { margin-left: auto; font-size: 12px; color: var(--muted); }
.live { margin-top: auto; padding: 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--bad); }
.dot.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 14px 32px; background: rgba(18, 21, 12, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1; max-width: 560px; }
.search input { width: 100%; padding: 10px 14px 10px 38px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: inherit; outline: none; }
.search input:focus { border-color: var(--accent2); }
.search svg { position: absolute; left: 12px; top: 11px; }
.results { position: absolute; top: 46px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; max-height: 60vh; overflow: auto; box-shadow: 0 16px 40px #0008; }
.results a { display: block; padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--text); }
.results a:hover, .results a.sel { background: var(--panel2); text-decoration: none; }
.results .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent2); }
.results .t { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { padding: 28px 32px 80px; max-width: 1200px; width: 100%; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
a.card { display: block; color: inherit; transition: border-color 0.15s, transform 0.15s; }
a.card:hover { border-color: var(--accent2); text-decoration: none; transform: translateY(-1px); }
.hero { background: linear-gradient(135deg, #26301A, #1A1F11 60%); padding: 26px 28px; }
.sec { margin: 34px 0 14px; display: flex; align-items: baseline; gap: 12px; }
.sec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent2); font-weight: 650; }
.sec .hint { color: var(--muted); font-size: 13px; }
.sec .r { margin-left: auto; font-size: 13px; }
.muted { color: var(--muted); } .t2 { color: var(--text2); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--panel2); color: var(--text2); border: 1px solid var(--line2); white-space: nowrap; }
.pill.training { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.pill.done, .pill.PASS, .pill.good { color: var(--good); border-color: #56682F; background: #1E2814; }
.pill.stopped, .pill.FAIL, .pill.bad { color: var(--bad); border-color: #6B3A30; background: #2E1814; }
.pill.current { color: var(--bg); background: var(--cream); border-color: var(--cream); }
.pill.running { color: var(--warn); border-color: #6E5426; }
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width 0.6s; }
.stat .v { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat .s { color: var(--text2); font-size: 12px; margin-top: 2px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--line2); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }
.tablewrap { overflow-x: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font: inherit; font-size: 14px; font-weight: 560; cursor: pointer; }
.btn:hover { border-color: var(--accent2); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.primary:hover { background: var(--cream); }
.btn[disabled] { opacity: 0.5; cursor: wait; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.term { border-bottom: 1px dotted var(--accent2); cursor: help; position: relative; }
.term:hover::after, .term:focus::after { content: attr(data-tip); position: absolute; left: 0; top: 130%; z-index: 20; width: max-content; max-width: 300px; padding: 9px 12px; background: #0A0C06; border: 1px solid var(--line2); border-radius: 10px; color: var(--text2); font-size: 13px; font-weight: 400; line-height: 1.45; text-transform: none; letter-spacing: 0; white-space: normal; box-shadow: 0 10px 30px #000a; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 6px 13px; border-radius: 99px; border: 1px solid var(--line2); background: transparent; color: var(--text2); font: inherit; font-size: 13px; cursor: pointer; }
.filters button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
input.filter { padding: 7px 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; color: var(--text); font: inherit; font-size: 14px; outline: none; min-width: 220px; }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-top: 12px; }
details > summary { padding: 12px 16px; cursor: pointer; font-weight: 600; color: var(--text2); list-style: none; }
details > summary::before { content: "▸"; display: inline-block; width: 18px; color: var(--accent2); transition: transform 0.15s; }
details[open] > summary::before { transform: rotate(90deg); }
details > .in { padding: 0 16px 16px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: #0A0C06; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.gif { width: 100%; max-width: 520px; border-radius: 12px; border: 1px solid var(--line); background: #000; display: block; }
.md { max-width: 860px; color: var(--text2); }
.md h1 { font-size: 28px; color: var(--text); margin: 4px 0 18px; }
.md h2 { font-size: 20px; color: var(--text); margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.md h3 { font-size: 16px; color: var(--cream); margin: 22px 0 8px; }
.md p, .md li { line-height: 1.7; }
.md strong { color: var(--text); }
.md table { margin: 12px 0; display: block; overflow-x: auto; }
.md img { max-width: 100%; max-height: 420px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 10px 0; }
.md blockquote { margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent2); background: var(--panel); border-radius: 0 10px 10px 0; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
mark { background: #5E5020; color: var(--cream); border-radius: 3px; padding: 0 2px; }
.doclayout { display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
.doclist { position: sticky; top: 90px; align-self: start; font-size: 14px; }
.doclist .g { color: var(--accent2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 6px; font-weight: 650; }
.doclist a { display: block; padding: 5px 10px; border-radius: 8px; color: var(--text2); }
.doclist a.on { background: var(--panel2); color: var(--text); }
.timeline { position: relative; display: grid; gap: 12px; }
.ph { display: grid; grid-template-columns: 44px 1fr; gap: 16px; }
.ph .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); }
.ph.done .num { background: #1E2814; color: var(--good); border-color: #56682F; }
.ph.current .num { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 5px #C9982F22; }
.ph.upcoming { opacity: 0.75; }
.steps { display: flex; gap: 6px; margin-top: 18px; }
.steps span { flex: 1; height: 6px; border-radius: 99px; background: var(--line2); }
.steps span.done { background: var(--good); }
.steps span.current { background: var(--accent); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.thumbs img { height: 90px; border-radius: 8px; border: 1px solid var(--line); }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: var(--radius); }
.toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; max-width: 380px; padding: 12px 16px; background: var(--panel2); border: 1px solid var(--accent2); border-radius: 12px; box-shadow: 0 12px 30px #000a; font-size: 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--text2); }
.chip { display: inline-block; padding: 2px 9px; margin: 2px 4px 2px 0; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line2); font-size: 12px; color: var(--text2); }
a.chip:hover { border-color: var(--accent2); text-decoration: none; }
.banner { padding: 12px 16px; border-radius: 12px; border: 1px solid #6E5426; background: #2A2010; color: var(--warn); font-size: 14px; margin-bottom: 16px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px 16px; border-right: none; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 8px 0 0; } .brand small, .live, nav.side a .n { display: none; }
  .top { padding: 10px 16px; } main { padding: 20px 16px 60px; }
  .doclayout { grid-template-columns: 1fr; } .doclist { position: static; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="side" id="nav">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#232A16"/><path d="M7 24 L14 15 L22 18 L25 9" stroke="#C9982F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="9" r="3" fill="#F5EFE3"/></svg>
      <div>rl-arm<small>robot arm that learns</small></div>
    </div>
    <a href="#/" data-r="">Now</a>
    <a href="#/exp" data-r="exp">Experiments</a>
    <a href="#/phases" data-r="phases">Phases</a>
    <a href="#/runs" data-r="runs">Runs <span class="n" id="nruns"></span></a>
    <a href="#/docs" data-r="docs">Docs</a>
    <a href="#/decisions" data-r="decisions">Decisions <span class="n" id="ndec"></span></a>
    <a href="#/help" data-r="help">Words explained</a>
    <div class="live" id="live"><span class="dot off"></span>connecting…</div>
  </nav>
  <div>
    <div class="top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7A486" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search docs, decisions and runs…  ( / )" autocomplete="off">
        <div class="results" id="qres" hidden></div>
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>
<script src="/marked.min.js"></script>
<script>
"use strict";
// ---------- words explained (tooltips + the "Words explained" page) ----------
const GLOSS = {
  "run": "One attempt at training a brand-new neural network from scratch, with one config and one seed. Everything about it lives in runs/<run name>/.",
  "seed": "The random starting point of a run. The same setup is trained with 3 seeds; if all three agree, the result isn't luck.",
  "step": "One control tick: the network looks at the arm and sends one command. 25 steps = 1 second of simulated time.",
  "success rate": "Out of 100 test attempts with new random targets, how many ended with the arm's tip within 2 cm of the target.",
  "typical miss": "The median distance between the tip and the target at the end of a test attempt. Lower is better.",
  "test score during training": "Every 20k–50k steps, training pauses briefly and the current network is tested on 100 separate 'validation' targets. This draws the learning curve; the best point is the model that is kept.",
  "time to reach": "How long the arm takes to first get within 2 cm, averaged over the successful attempts.",
  "smoothness": "How much the command changes from one step to the next. Lower = smoother, less jerky movement.",
  "energy": "Work done by the motors in one attempt (joules). Only measured when the network commands forces directly (torque modes).",
  "reward": "The score the network is trained to maximise. It's built from several terms (precision bonus, success bonus, penalties), each logged separately.",
  "SAC": "Soft Actor-Critic: a learning algorithm that keeps a big memory of past experience and reuses it. The main algorithm in this project.",
  "PPO": "Proximal Policy Optimisation: a learning algorithm that learns only from fresh experience, usually from many simulators in parallel.",
  "HER": "Hindsight Experience Replay: replays a missed attempt as if the arm had been aiming where it actually ended up, so even misses teach something.",
  "IK": "Inverse kinematics: exact maths that turns a target position into the joint angles that reach it. No learning involved.",
  "action mode": "What the network's output means: nudge each joint a bit (delta_pos), jump to a joint angle (abs_pos), or push with a force (torque).",
  "gate": "The pass/fail checks a phase must meet before it counts as done (scripts/check_phase.py). Phase 4 has none on purpose: its numbers are results, not targets.",
  "checkpoint": "A saved copy of the network during training. model.zip = the best one on validation targets, final.zip = the last one.",
  "config": "The YAML file in configs/ that fully describes a run: task, robot, reward weights, algorithm and its settings.",
  "phase": "The project is split into 8 phases (0–7). Each one builds something, passes its gate, gets a report and a commit.",
  "dry run": "A tiny ~6k-step trial that runs before every real training job, only to catch crashes early. Hidden from this dashboard.",
  "reach": "Task A: move the arm's tip to a random target within 2 cm.",
  "hold": "Task B: reach the target and then stay still on it for the last 2 seconds.",
  "steps per second": "How fast training runs on this laptop. More parallel runs = each one is slower.",
};
const tip = (word, label) => `<span class="term" tabindex="0" data-tip="${esc(GLOSS[word] || "")}">${esc(label || word)}</span>`;
const TARGETS = { "Phase 3 · reach": [0.95, 10], "Phase 3 · hold": [0.90, null] };
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => (x == null ? "–" : (100 * x).toFixed(d) + "%");
const ms = (a, f = (v) => v.toFixed(0)) => (a == null ? "–" : `${f(a[0])} <span class="muted">± ${f(a[1])}</span>`);
const mm = (x) => (x == null ? "–" : x.toFixed(x < 10 ? 1 : 0) + " mm");
const ksteps = (n) => (n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M" : Math.round(n / 1000) + "k");
const dur = (s) => { if (s == null) return "–"; s = Math.round(s); if (s < 60) return s + " s"; const m = Math.round(s / 60); if (m < 60) return m + " min"; const h = Math.floor(m / 60); return `${h} h ${m % 60} min`; };
const statusPill = (s) => `<span class="pill ${esc(s)}">${{ training: "● training", done: "finished", stopped: "stopped" }[s] || esc(s)}</span>`;
const cfgVal = (v) => (v === "—" ? '<span class="muted">not set</span>' : esc(typeof v === "string" ? v : JSON.stringify(v)));
// TensorBoard-style exponential smoothing for noisy per-episode curves
const smooth = (pts, a = 0.9) => { if (!pts || pts.length < 60) return pts; let m = pts[0][1]; return pts.map((p) => [p[0], (m = a * m + (1 - a) * p[1])]); };
function prettyCfg(c) { return c.replace(/_s\d+$/, "").replace(/_/g, " "); }
function runTitle(r) { return r.exp[0] || r.best || prettyCfg(r.config); }
function runSub(r) { return `seed ${r.seed} · ${r.algo}${r.mode ? " · " + r.mode : ""}`; }
async function api(path, opts) { const res = await fetch(path, opts); return res.json(); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; document.body.append(t); setTimeout(() => t.remove(), 5000); }
async function act(body, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api("/api/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.error) toast(`<span class="bad">${esc(r.error)}</span>`);
    else if (r.ok) toast(esc(r.ok));
    else if (r.job) { toast("Running the gate at low priority. The result appears on this page in a minute."); poll(); }
  } finally { if (btn) setTimeout(() => (btn.disabled = false), 2500); }
}
function copy(text) { navigator.clipboard.writeText(text).then(() => toast(`Copied <code>${esc(text)}</code>. Paste it to Claude to talk about this run.`)); }

// Block-wise rendering: only blocks whose HTML changed are replaced, so GIFs keep playing,
// open <details> stay open and inputs keep focus while data refreshes every 2 s.
function mount(blocks) {
  const main = $("#main");
  const keys = blocks.map((b) => b[0]).join("|");
  if (main.dataset.keys !== keys) {
    main.dataset.keys = keys;
    main.innerHTML = blocks.map(([k]) => `<div data-b="${k}"></div>`).join("");
  }
  for (const [k, html] of blocks) {
    const el = main.querySelector(`[data-b="${k}"]`);
    if (el._html !== html) { const open = [...el.querySelectorAll("details[open]")].map((d) => d.dataset.k); el.innerHTML = html; el._html = html; open.forEach((o) => { const d = el.querySelector(`details[data-k="${o}"]`); if (d) d.open = true; }); }
  }
}

// ---------- SVG line chart with hover ----------
const CHARTS = {};
function chart(series, o = {}) {
  series = series.filter((s) => s.pts && s.pts.length);
  if (!series.length) return `<div class="empty small">${o.empty || "No data yet."}</div>`;
  const W = 640, H = o.h || 220, L = 46, R = 12, T = 12, B = 28;
  const xs = series.flatMap((s) => s.pts.map((p) => p[0]));
  let ys = series.flatMap((s) => s.pts.flatMap((p) => (s.band ? [p[1] - p[2], p[1] + p[2]] : [p[1]])));
  const x0 = o.x0 ?? Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  let y0 = o.y0 ?? Math.min(...ys), y1 = o.y1 ?? Math.max(...ys);
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  if (o.y0 == null && o.y1 == null) { const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad; }
  const X = (x) => L + ((x - x0) / (x1 - x0)) * (W - L - R), Y = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const yf = o.yf || ((v) => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k" : +v.toPrecision(3)));
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + ((y1 - y0) * i) / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#303A21" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#A7A486">${yf(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const v = x0 + ((x1 - x0) * i) / 4; g += `<text x="${X(v)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#A7A486">${ksteps(v)}</text>`; }
  let body = "";
  series.forEach((s, i) => {
    const c = s.color || COLORS[i % COLORS.length];
    if (s.band) body += `<path d="M${s.pts.map((p) => `${X(p[0])},${Y(p[1] + p[2])}`).join("L")}L${[...s.pts].reverse().map((p) => `${X(p[0])},${Y(p[1] - p[2])}`).join("L")}Z" fill="${c}" opacity="0.16"/>`;
    body += `<path d="M${s.pts.map((p) => `${X(p[0])},${Y(p[1])}`).join("L")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    if (s.pts.length < 40) body += s.pts.map((p) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="${c}"/>`).join("");
  });
  // id from the content, so an unchanged chart renders identical HTML and mount() leaves it alone
  const key = JSON.stringify([series, o.h, o.y0, o.y1]);
  let hsh = 0; for (let i = 0; i < key.length; i++) hsh = (hsh * 31 + key.charCodeAt(i)) | 0;
  const id = "c" + (hsh >>> 0).toString(36);
  CHARTS[id] = { series, X, Y, x0, x1, L, R, W, H, T, B, yf: o.tf || yf };
  const legend = series.length > 1 || o.legend ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${s.color || COLORS[i % COLORS.length]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart" data-c="${id}"><svg viewBox="0 0 ${W} ${H}" onmousemove="hover(event,'${id}')" onmouseleave="unhover('${id}')">${g}${body}<line class="xh" y1="${T}" y2="${H - B}" stroke="#A7A486" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>${legend}</div>`;
}
function hover(e, id) {
  const c = CHARTS[id], svg = e.currentTarget, box = svg.getBoundingClientRect();
  const x = ((e.clientX - box.left) / box.width) * c.W;
  const sx = c.x0 + ((x - c.L) / (c.W - c.L - c.R)) * (c.x1 - c.x0);
  let rows = [], px = null;
  c.series.forEach((s, i) => {
    let best = s.pts[0];
    for (const p of s.pts) if (Math.abs(p[0] - sx) < Math.abs(best[0] - sx)) best = p;
    px = px ?? best[0];
    rows.push(`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${s.color || COLORS[i % COLORS.length]}"></i>${esc(s.name || "")} <b>${c.yf(best[1])}</b>${s.band ? ` ± ${c.yf(best[2])}` : ""}</div>`);
  });
  const line = svg.querySelector(".xh"); line.setAttribute("x1", c.X(px)); line.setAttribute("x2", c.X(px)); line.setAttribute("opacity", 1);
  const t = svg.parentNode.querySelector(".tip");
  t.innerHTML = `<div class="muted">step ${ksteps(px)}</div>${rows.join("")}`; t.style.display = "block";
  const left = (c.X(px) / c.W) * box.width; t.style.left = Math.min(left + 12, box.width - t.offsetWidth) + "px"; t.style.top = "8px";
}
function unhover(id) { const el = document.querySelector(`[data-c="${id}"]`); if (!el) return; el.querySelector(".tip").style.display = "none"; el.querySelector(".xh").setAttribute("opacity", 0); }
function spark(pts) {

  const W = 120, H = 30, x0 = pts[0][0], x1 = pts.at(-1)[0];
  const d = pts.map((p) => `${((p[0] - x0) / (x1 - x0 || 1)) * W},${H - p[1] * H}`).join("L");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible"><path d="M${d}" fill="none" stroke="#C9982F" stroke-width="1.8"/></svg>`;

async function loadExp(id, quiet) { const d = await api("/api/exp/" + id); if (route().arg !== id) return; detail.exp = d; if (quiet) pageExp(id); else pageExp(id); }
function pageExp(id) {
  if (!detail.exp || detail.exp.id !== id) { mount([["h", `<p class="muted">Loading…</p>`]]); return loadExp(id); }
  const e = detail.exp;

    const hs = a.seeds.map((s) => s.val || []).filter((h) => h.length);
    if (!hs.length) return { name: a.plain, pts: [] };

    const pts = [...Array(n).keys()].map((k) => { const v = hs.map((h) => h[k][1] * 100); const m = v.reduce((x, y) => x + y) / v.length; return [hs[0][k][0], m, Math.sqrt(v.reduce((x, y) => x + (y - m) ** 2, 0) / v.length)]; });

  });
  const allDone = e.arms.every((a) => a.success);
  const ranked = [...e.arms].filter((a) => a.success).sort((a, b) => b.success[0] - a.success[0]);
  const verdict = allDone && ranked.length > 1 ? `<div class="card" style="border-color:var(--accent2)"><b>Result:</b> <span class="t2">${esc(ranked[0].plain)} scores best (${(ranked[0].success[0] * 100).toFixed(0)}% ± ${(ranked[0].success[1] * 100).toFixed(0)}), ${esc(ranked.at(-1).plain.toLowerCase())} worst (${(ranked.at(-1).success[0] * 100).toFixed(0)}%). ${Math.abs(ranked[0].success[0] - ranked[1].success[0]) < ranked[0].success[1] + ranked[1].success[1] ? "The top two overlap within their seed spread, so treat them as close." : "The gap is bigger than the spread between seeds, so it's a real difference."}</span></div>` : `<div class="card"><span class="muted">The verdict appears here once every seed of every setup has finished.</span></div>`;
  const ps = (x) => (x == null ? "–" : ms([x[0] * 100, x[1] * 100]) + "%");
  const sec = (a) => (a == null ? "–" : `${(a[0] / e.hz).toFixed(1)} s <span class="muted">± ${(a[1] / e.hz).toFixed(1)}</span>`);
  const rows = e.arms.map((a, i) => `<tr><td><b>${esc(a.plain)}</b><div class="tiny muted">${esc(a.label)}</div></td><td>${ps(a.success)}</td><td>${a.seeds.map((s) => s.id ? `<a class="chip" href="#/run/${s.id}">s${s.seed} ${s.eval ? pct(s.eval.success_rate) : s.status === "training" ? `● ${pct(s.steps / (s.total || 1))}` : esc(s.status)}</a>` : `<span class="chip">s${s.seed} not started</span>`).join("")}</td><td>${a.miss_mm ? ms(a.miss_mm, (v) => v.toFixed(1)) + " mm" : "–"}</td><td>${sec(a.steps_to_success)}</td><td>${a.smoothness ? ms(a.smoothness, (v) => v.toFixed(3)) : "–"}</td><td>${a.energy ? ms(a.energy, (v) => v.toFixed(2)) + " J" : '<span class="muted">n/a</span>'}</td></tr>`).join("");
  const budgets = [...new Set(e.arms.map((a) => (a.learns ? ksteps(a.steps) + " steps" : "no training")))].join(" / ");
  mount([
    ["h", `<a class="small" href="#/exp">← all experiments</a><div class="row" style="margin-top:10px"><span class="pill">${esc(e.id.slice(0, 2).toUpperCase())}</span></div><h1 style="margin-top:10px">${esc(e.question)}</h1><p class="t2" style="max-width:780px">${esc(e.why)}</p>`],
    ["verdict", verdict],
    ["chart", `<div class="sec"><h2>Learning curves</h2><span class="hint">${tip("test score during training")}, mean of the seeds; the shaded band is the spread between seeds</span></div><div class="card">${curves.length ? chart(curves, { y0: 0, y1: 100, yf: (v) => v.toFixed(0) + "%", legend: true, empty: "Curves appear after the first test, 20k steps into training." }) : `<p class="muted">This experiment compares finished policies; there is no learning curve for the IK controller.</p>`}</div>`],
    ["table", `<div class="sec"><h2>Final test</h2><span class="hint">100 attempts per seed, new random targets; mean ± spread over seeds</span></div><div class="card tablewrap"><table><tr><th>Setup</th><th>${tip("success rate", "Success")}</th><th>Per ${tip("seed", "seed")} (click to open)</th><th>${tip("typical miss", "Typical miss")}</th><th>${tip("time to reach", "Time to reach")}</th><th>${tip("smoothness", "Jerkiness")}</th><th>${tip("energy", "Energy")}</th></tr>${rows}</table></div>`],
    ["meta", `<details data-k="setup"><summary>Exact setup (seeds, budget, configs)</summary><div class="in"><dl class="kv"><dt>Seeds</dt><dd>${[...new Set(e.arms.map((a) => a.seeds.map((s) => s.seed).join(", ")))].join(" / ")}</dd><dt>Step budget</dt><dd>${budgets} per run</dd><dt>Technical question</dt><dd>${esc(e.tech_question)}</dd>${e.arms.map((a) => `<dt>${esc(a.plain)}</dt><dd><code>${esc(a.config)}</code></dd>`).join("")}</dl><p class="tiny muted">The same numbers are written to <a href="#/doc/docs/results.md">docs/results.md</a> by <code>scripts/make_results.py</code> when the phase ends.</p></div></details>`],

// ---------- page: Runs ----------
let runFilter = "count", runText = "";
function pageRuns() {
  const f = { count: (r) => r.best || r.exp.length || r.status === "training", phase: (r) => S.phase.runs.includes(r.id), training: (r) => r.status === "training", all: () => true }[runFilter];
  const t = runText.toLowerCase();
  const list = S.runs.filter(f).filter((r) => !t || (r.id + " " + runTitle(r) + " " + r.exp.join(" ") + " " + r.algo).toLowerCase().includes(t));
  const groups = [];
  // a run appears once, except that experiments may share runs (E2/E3 reuse E1's delta_pos), so each experiment lists all of its own
  const take = (title, hint, pred, shared, order) => { const g = list.filter((r) => (shared || !r._g) && pred(r)); if (!shared) g.forEach((r) => (r._g = 1)); if (order) g.sort((a, b) => order(a) - order(b) || a.seed - b.seed); if (g.length) groups.push([title, hint, g]); };
  list.forEach((r) => delete r._g);
  take("Training now", "", (r) => r.status === "training");
  for (const e of S.experiments) {
    const tag = e.id.slice(0, 2).toUpperCase() + " · ";
    const arm = (r) => e.arms.indexOf((r.exp.find((x) => x.startsWith(tag)) || "").slice(tag.length));
    take(`${tag}${e.plain}`, "Phase 4 experiment", (r) => r.status !== "training" && arm(r) >= 0, true, arm);
  }
  take("Best runs", "the ones the phase gates use (docs/best_runs.yaml)", (r) => r.best);
  list.forEach((r) => { if (r.exp.length) r._g = 1; });
  take("Archive", "earlier attempts, tuning sweeps and pilots: kept for the record", () => true);
  const head = `<h1>Runs</h1><p class="t2">Each ${tip("run")} is one training attempt. By default you see only the ones that matter; the rest are in the archive.</p>
    <div class="row" style="margin-top:16px"><div class="filters">${[["count", "That count"], ["phase", "This phase"], ["training", "Training"], ["all", `All (${S.runs.length})`]].map(([k, l]) => `<button class="${runFilter === k ? "on" : ""}" onclick="runFilter='${k}';render()">${l}</button>`).join("")}</div><span class="sp"></span><input class="filter" id="runq" placeholder="Filter runs…" oninput="runText=this.value;pageRuns()"></div>`;
  const body = groups.length ? groups.map(([title, hint, g]) => `<div class="sec"><h2>${esc(title)}</h2><span class="hint">${esc(hint)}</span></div><div class="card tablewrap" style="padding:6px 8px"><table><tr><th>Run</th><th>State</th><th>Steps</th><th>${tip("success rate", "Success")}</th><th>${tip("typical miss", "Miss")}</th><th>Date</th></tr>${g.map(runRow).join("")}</table></div>`).join("") : `<div class="empty" style="margin-top:20px">No runs match.</div>`;
  mount([["runsh", head], ["runsb", body]]);
  keepInput("#runq", runText);
}
function runRow(r) {
  const tgt = TARGETS[r.best];
  const sOk = tgt && r.success != null ? (r.success >= tgt[0] ? " good" : " bad") : "";
  const mOk = tgt && tgt[1] && r.miss_mm != null ? (r.miss_mm <= tgt[1] ? " good" : " bad") : "";
  return `<tr class="click" onclick="location.hash='#/run/${r.id}'"><td><b>${esc(runTitle(r))}</b> <span class="muted small">· seed ${r.seed}</span><div class="tiny muted">${esc(r.algo)}${r.mode ? " · " + esc(r.mode) : ""}${r.exp.length > 1 ? ` · also used in ${esc(r.exp.slice(1).map((x) => x.split(" ")[0]).join(", "))}` : ""}</div></td><td>${statusPill(r.status)}</td><td class="t2">${r.learns ? (r.status === "training" ? `${ksteps(r.steps)} / ${ksteps(r.total)}` : ksteps(r.steps)) : "–"}</td><td class="${sOk}">${pct(r.success)}</td><td class="${mOk}">${mm(r.miss_mm)}</td><td class="muted small">${esc(r.date)}</td></tr>`;
}

// ---------- page: Run ----------
async function loadRun(id, quiet) { const d = await api("/api/run/" + encodeURIComponent(id)); if (route().arg !== id) return; detail.run = d; pageRun(id); }

    tile(pct(r.success), tip("success rate", "Success rate"), tgt ? `gate: ≥ ${pct(tgt[0])}` : r.status === "training" ? `test so far: ${pct(r.val_last)}` : "", tgt && r.success != null ? (r.success >= tgt[0] ? "good" : "bad") : ""),
    tile(mm(r.miss_mm), tip("typical miss", "Typical miss"), ev.final_dist_mm_mean != null ? `average: ${mm(ev.final_dist_mm_mean)}` : "", tgt && tgt[1] && r.miss_mm != null ? (r.miss_mm <= tgt[1] ? "good" : "bad") : ""),
    tile(ev.steps_to_success_mean != null ? (ev.steps_to_success_mean / 25).toFixed(1) + " s" : "–", tip("time to reach", "Time to reach"), ev.steps_to_success_mean != null ? `${ev.steps_to_success_mean.toFixed(0)} steps` : ""),
    tile(ev.smoothness_mean != null ? ev.smoothness_mean.toFixed(3) : "–", tip("smoothness", "Jerkiness"), "lower is smoother"),
    tile(r.learns ? ksteps(r.status === "training" ? r.steps : r.summary?.steps ?? r.steps) : "–", tip("step", "Training steps"), r.wall_s ? `took ${dur(r.wall_s)}` : r.learns ? "" : "no training (exact maths)"),
  ].join("")}</div>`;
  const gif = r.gif ? `<img class="gif" src="/file/runs/${r.id}/video.gif" alt="recorded test attempts">` : `<div class="empty small">${r.status === "training" ? "The video is recorded when training ends. Meanwhile, Watch live shows the latest checkpoint." : "No video for this run."}</div>`;

    <dl class="kv"><dt>Run name</dt><dd class="mono">${esc(r.id)}</dd><dt>Counts for</dt><dd>${esc([r.best, ...r.exp].filter(Boolean).join(", ") || "nothing (archive)")}</dd><dt>Algorithm</dt><dd>${esc(r.algo)}</dd><dt>${tip("action mode", "Action mode")}</dt><dd>${esc(r.mode || "–")}</dd><dt>Kept model</dt><dd>${esc(r.summary?.best_checkpoint || "–")}</dd><dt>Code version</dt><dd class="mono">${esc(r.git_hash || "–")}</dd></dl></div></div>`;

    ["raw", `<details data-k="cfg"><summary>Full config</summary><div class="in"><pre>${esc(r.config_text)}</pre></div></details><details data-k="eval"><summary>Raw results (eval.json, summary.json)</summary><div class="in"><pre>${esc(JSON.stringify({ eval: r.eval, summary: r.summary }, null, 1))}</pre></div></details>${r.log.length ? `<details data-k="log"><summary>Training log (last 40 lines)</summary><div class="in"><p class="tiny muted">${esc(r.log_path)}</p><pre>${esc(r.log.join("\n"))}</pre></div></details>` : ""}`],

// ---------- docs ----------
function md(text, path) {
  const dir = path.split("/").slice(0, -1).join("/");
  const el = document.createElement("div");
  el.innerHTML = marked.parse(text.replace(/<!--[\s\S]*?-->/g, ""));
  const resolve = (src) => new URL(src, "http://x/" + (dir ? dir + "/" : "")).pathname.slice(1);
  el.querySelectorAll("img").forEach((i) => { const s = i.getAttribute("src"); if (s && !/^(https?:|data:|\/)/.test(s)) i.src = "/file/" + resolve(s); i.loading = "lazy"; });
  el.querySelectorAll("a").forEach((a) => { const h = a.getAttribute("href"); if (h && /\.md(#.*)?$/.test(h) && !/^https?:/.test(h)) a.href = "#/doc/" + resolve(h.replace(/#.*/, "")); else if (h && /^https?:/.test(h)) a.target = "_blank"; });
  el.querySelectorAll("table").forEach((t) => t.classList.add("tablewrap"));
  el.querySelectorAll("h2").forEach((h, i) => (h.id = "h" + i));
  return el.innerHTML;
}
function inline(s) { return marked.parseInline(esc(s).replace(/&#39;/g, "'").replace(/&quot;/g, '"')); }
function docNav(cur) {
  let g = "", out = "";
  for (const d of S.docs) { if (d.group !== g) { g = d.group; out += `<div class="g">${esc(g)}</div>`; } out += `<a class="${d.path === cur ? "on" : ""}" href="#/doc/${d.path}">${esc(d.title)}</a>`; }
  return out + `<div class="g">Logs</div><a href="#/decisions">Decision log</a>`;
}
function pageDocs() { location.replace("#/doc/" + (S.docs[0]?.path || "")); }
async function loadDoc(path, quiet) {
  const d = await api("/api/doc?path=" + encodeURIComponent(path));
  if (route().arg !== path) return;
  if (quiet && detail.doc && detail.doc.text === d.text) return;
  detail.doc = d; pageDoc(path);
}
function pageDoc(path) {
  if (!detail.doc || (detail.doc.path !== path && !detail.doc.error)) { mount([["doc", `<div class="doclayout"><div class="doclist">${docNav(path)}</div><p class="muted">Loading…</p></div>`]]); return loadDoc(path); }
  const d = detail.doc, q = new URLSearchParams(location.search).get("q");
  let html = d.error ? `<div class="empty">${esc(d.error)}</div>` : md(d.text, d.path);
  const hl = detail.hl;
  if (hl) html = html.replace(/>([^<]+)</g, (m, t) => ">" + t.replace(new RegExp(hl.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (x) => `<mark>${x}</mark>`) + "<");
  const toc = [...html.matchAll(/<h2 id="(h\d+)">(.*?)<\/h2>/g)];
  const tocHtml = toc.length > 2 ? `<div class="g">On this page</div>${toc.map((m) => `<a href="javascript:void 0" onclick="document.getElementById('${m[1]}').scrollIntoView({behavior:'smooth'})">${m[2]}</a>`).join("")}` : "";
  mount([["doc", `<div class="doclayout"><div class="doclist">${tocHtml}${docNav(path)}</div><div><div class="row tiny muted" style="margin-bottom:6px"><span class="mono">${esc(d.path || path)}</span><span class="sp"></span>${d.mtime ? "last edited " + new Date(d.mtime * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + " · refreshes by itself" : ""}</div><div class="md">${html}</div></div></div>`]]);

let qTimer = null, qSel = -1, qHits = [];

  if (e.key === "Escape") { box.hidden = true; e.target.blur(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); } });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("#qres").hidden = true; });
function openHit(h) { $("#qres").hidden = true; if (h.kind === "doc") detail.hlNext = $("#q").value.trim(); if (h.kind === "decision") decText = $("#q").value.trim(); location.hash = hitHref(h); }
async function doSearch(q) {
  const box = $("#qres");
  if (q.trim().length < 2) { box.hidden = true; return; }
  qHits = await api("/api/search?q=" + encodeURIComponent(q)); qSel = -1;
  box.innerHTML = qHits.length ? qHits.slice(0, 12).map((h, i) => `<a href="${hitHref(h)}" data-i="${i}"><div class="k">${esc(h.kind)} · ${esc(h.title)}</div><div class="t">${esc(h.text)}</div></a>`).join("") + (qHits.length > 12 ? `<a href="#/search/${encodeURIComponent(q)}"><div class="t">All ${qHits.length} results →</div></a>` : "") : `<a><div class="t">Nothing found.</div></a>`;
  box.querySelectorAll("a[data-i]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); openHit(qHits[+a.dataset.i]); }));
  box.hidden = false;
}
async function pageSearch(q) {
  const hits = detail.search?.q === q ? detail.search.hits : null;
  if (!hits) { mount([["h", `<p class="muted">Searching…</p>`]]); const h = await api("/api/search?q=" + encodeURIComponent(q)); detail.search = { q, hits: h }; return pageSearch(q); }
  mount([["h", `<h1>Search: “${esc(q)}”</h1><p class="muted">${hits.length} result(s)${hits.length >= 80 ? " (first 80)" : ""}</p>`],
    ["l", hits.length ? `<div class="card" style="padding:6px 8px">${hits.map((h, i) => `<a href="${hitHref(h)}" onclick="detail.hlNext='${esc(q).replace(/'/g, "")}'" style="display:block;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)"><div class="tiny" style="color:var(--accent2);text-transform:uppercase;letter-spacing:.06em">${esc(h.kind)} · ${esc(h.title)}</div><div class="small t2">${esc(h.text)}</div></a>`).join("")}</div>` : `<div class="empty">Nothing found.</div>`]]);
}
// filter inputs live in blocks that never re-render while typing; restore their text after a page switch
function keepInput(sel, val) { const el = $("#main").querySelector(sel); if (el && document.activeElement !== el && el.value !== val) el.value = val; }

poll();
</script>

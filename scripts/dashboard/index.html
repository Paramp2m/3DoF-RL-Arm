<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1109">
<title>rl-arm dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2312150C'/><path d='M7 24 L14 15 L22 18 L25 9' stroke='%23C9982F' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='25' cy='9' r='3' fill='%23F5EFE3'/></svg>">
<style>
:root {
  /* palette F5EFE3 4F5B2A B8892D D8C9A8 (colorhunt), stretched darker at the dark end and lighter at the light end */
  --bg: #0E1109; --panel: #161B0F; --panel2: #1E2515; --panel3: #283019; --line: #29321F; --line2: #3B4629;
  --olive: #4F5B2A; --muted: #A3A084; --text2: #E0D6BE; --text: #FBF8F1;
  --accent: #C9982F; --accent-hi: #E2B54E; --accent2: #D8C9A8; --cream: #F5EFE3;
  --good: #A9C27A; --bad: #E07A64; --warn: #E8A54B; --info: #8EB1C1;
  --s1: #C9982F; --s2: #A9C27A; --s3: #8EB1C1; --s4: #D98C7A; --s5: #F5EFE3;
  --radius: 16px;
  --sans: "Noto Sans", Roboto, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Noto Sans Mono", "Fira Code", ui-monospace, monospace;
  --lift: inset 0 1px 0 rgba(255, 255, 255, 0.035), 0 10px 30px rgba(0, 0, 0, 0.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); overscroll-behavior-y: none; } /* no pull-to-refresh: the page updates itself */
body { margin: 0; color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  background: radial-gradient(1100px 600px at 0% -10%, rgba(79, 91, 42, 0.32), transparent 62%), radial-gradient(900px 520px at 105% 0%, rgba(201, 152, 47, 0.09), transparent 60%), var(--bg); background-attachment: fixed; min-height: 100vh; }
a { color: var(--accent-hi); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: rgba(201, 152, 47, 0.35); }
code, pre, .mono { font-family: var(--mono); font-size: 0.86em; }
code { background: var(--panel2); padding: 1px 6px; border-radius: 6px; color: var(--cream); border: 1px solid var(--line); }
pre { background: #0A0D06; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; color: var(--text2); max-height: 480px; }
pre code { background: none; padding: 0; border: 0; }
h1, h2, h3 { line-height: 1.22; margin: 0; font-weight: 700; letter-spacing: -0.015em; }
h1 { font-size: 28px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
svg { flex: none; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.layout { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
nav.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; background: rgba(10, 13, 7, 0.72); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 20px; font-weight: 750; font-size: 17px; white-space: nowrap; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(145deg, #2A3318, #161B0F); border: 1px solid var(--line2); display: grid; place-items: center; }
.logo .j { transform-box: view-box; transform-origin: 9px 24px; animation: logo 6s ease-in-out infinite; }
@keyframes logo { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
nav.side a.nl { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 11px; color: var(--text2); font-weight: 560; font-size: 14.5px; transition: background 0.15s, color 0.15s; }
nav.side a.nl .ic { color: var(--muted); transition: color 0.15s; }
nav.side a.nl:hover { background: var(--panel); text-decoration: none; color: var(--text); }
nav.side a.nl.on { background: linear-gradient(90deg, rgba(79, 91, 42, 0.6), rgba(79, 91, 42, 0.18)); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
nav.side a.nl.on .ic { color: var(--accent-hi); }
nav.side a .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
nav.side a .n.hot { color: var(--accent-hi); }
.navsep { height: 1px; background: var(--line); margin: 10px 8px; }
.live { margin-top: auto; padding: 12px 10px 4px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.5; }
.live kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--line2); border-radius: 5px; color: var(--text2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 0 3px rgba(169, 194, 122, 0.15); }
.dot.off { background: var(--bad); box-shadow: 0 0 0 3px rgba(224, 122, 100, 0.15); }
.dot.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.top { position: sticky; top: 0; z-index: 8; display: flex; gap: 12px; align-items: center; padding: 12px 32px; background: rgba(14, 17, 9, 0.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .brand { display: none; padding: 0; }
.search { position: relative; flex: 1; max-width: 560px; }
.search input { width: 100%; padding: 10px 14px 10px 40px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: inherit; outline: none; transition: border-color 0.15s, background 0.15s; }
.search input:focus { border-color: var(--accent2); background: var(--panel2); }
.search .ic { position: absolute; left: 13px; top: 11px; color: var(--muted); width: 17px; height: 17px; pointer-events: none; }
.search input:focus-visible { box-shadow: 0 0 0 3px rgba(201, 152, 47, 0.3); }
.results { position: absolute; top: 48px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; max-height: 60vh; overflow: auto; box-shadow: 0 18px 50px #000a; }
.results a { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text); }
.results a:hover, .results a.sel { background: var(--panel2); text-decoration: none; }
.results .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent2); }
.results .t { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vit { margin-left: auto; display: inline-flex; align-items: center; gap: 12px; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line2); background: var(--panel); color: var(--text2); font-size: 13px; font-weight: 600; white-space: nowrap; transition: border-color 0.15s; }
.vit:hover { text-decoration: none; border-color: var(--accent2); }
.vit span { display: inline-flex; align-items: center; gap: 5px; }
.vit .ic { width: 15px; height: 15px; color: var(--muted); }
.vit .ld { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.vit .ld.off { background: var(--bad); }
.vit.stale > span:not(.ld) { opacity: 0.45; }
/* can't reach the laptop: a strip under the top bar, so it's seen wherever the page is scrolled */
.offline { position: absolute; left: 0; right: 0; top: 100%; padding: 7px 32px; background: #3A1F14; border-bottom: 1px solid #6B3420; color: var(--cream); font-size: 13px; line-height: 1.4; }
.offline b { color: #F2A48E; }
main { padding: 28px 32px 90px; max-width: 1240px; width: 100%; margin: 0 auto; }
main:focus { outline: none; }
main.enter { animation: enter 0.28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- building blocks ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.gc2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g4c { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); }
.card { background: linear-gradient(180deg, rgba(255, 255, 255, 0.012), transparent 40%), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; box-shadow: var(--lift); }
/* lifted with top, not transform: a transform would re-anchor the fixed glossary tooltips inside it */
a.card { display: block; color: inherit; position: relative; top: 0; transition: border-color 0.15s, top 0.15s, box-shadow 0.15s; }
a.card:hover { border-color: var(--line2); text-decoration: none; top: -2px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 16px 40px rgba(0, 0, 0, 0.3); }
.card h3 { display: flex; align-items: center; gap: 8px; }
.card h3 .ic { color: var(--accent2); width: 17px; height: 17px; }
.sec { margin: 38px 0 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent2); font-weight: 700; display: flex; align-items: center; gap: 10px; }
.sec h2::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--accent); }
.sec .hint { color: var(--muted); font-size: 13px; }
.sec .r { margin-left: auto; font-size: 13px; }
.muted { color: var(--muted); } .t2 { color: var(--text2); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--panel2); color: var(--text2); border: 1px solid var(--line2); white-space: nowrap; line-height: 1.6; }
.pill.training { color: #1A1406; background: var(--accent); border-color: var(--accent); }
.pill.training::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #1A1406; animation: pulse 1.6s infinite; }
.pill.done, .pill.PASS, .pill.good { color: var(--good); border-color: var(--olive); background: #1C2612; }
.pill.stopped, .pill.FAIL, .pill.bad { color: var(--bad); border-color: #6B3A30; background: #2C1712; }
.pill.current { color: var(--bg); background: var(--cream); border-color: var(--cream); }
.pill.running, .pill.warn { color: var(--warn); border-color: #6E5426; background: #271E0F; }
.bar { height: 8px; background: var(--panel3); border-radius: 99px; overflow: hidden; }
.bar.thin { height: 4px; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width 0.6s; }
.bar > i.dim { background: linear-gradient(90deg, #5C5B49, var(--muted)); }
.bar > i.good { background: linear-gradient(90deg, #7E9656, var(--good)); } .bar > i.warn { background: linear-gradient(90deg, #B98232, var(--warn)); } .bar > i.bad { background: linear-gradient(90deg, #A4503F, var(--bad)); }
.stat .v { font-size: 27px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; }
.stat .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat .s { color: var(--text2); font-size: 12px; margin-top: 3px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .accent { color: var(--accent-hi); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 650; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 10px; border-bottom: 1px solid var(--line2); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
a.rl { color: var(--text); } /* a run's name: a real link for the keyboard, styled like the text around it */
button.arw { background: none; border: 0; padding: 4px; margin: -4px; color: var(--muted); font: inherit; cursor: pointer; }
table.runs { table-layout: fixed; min-width: 640px; }
table.runs td { vertical-align: middle; }
tr.setup td { background: rgba(255, 255, 255, 0.012); }
.num { white-space: nowrap; font-variant-numeric: tabular-nums; } tr.click:hover td { background: var(--panel2); }
.tablewrap { overflow-x: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 11px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s; }
.btn:hover { border-color: var(--accent2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #1A1406; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hi); }
.btn.sm { padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: 0.5; cursor: wait; }
.remote .laptop { display: none !important; } /* opened via Tailscale: hide what only works at the laptop */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.term { border-bottom: 1px dotted var(--accent2); cursor: help; position: relative; }
/* fixed to the screen (placed by placeTip), so a tooltip never widens the page or gets cut off by a scrolling table */
.term:hover::after, .term:focus::after { content: attr(data-tip); position: fixed; left: var(--tx, 16px); top: var(--ty, auto); bottom: var(--tb, auto); z-index: 40; width: max-content; max-width: min(300px, calc(100vw - 32px)); padding: 9px 12px; background: #0A0C06; border: 1px solid var(--line2); border-radius: 10px; color: var(--text2); font-size: 13px; font-weight: 400; line-height: 1.45; text-transform: none; letter-spacing: 0; white-space: normal; box-shadow: 0 10px 30px #000a; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 6px 13px; border-radius: 99px; border: 1px solid var(--line2); background: transparent; color: var(--text2); font: inherit; font-size: 13px; cursor: pointer; transition: background 0.15s; }
.filters button:hover { background: var(--panel); }
.filters button.on { background: var(--accent); color: #1A1406; border-color: var(--accent); font-weight: 650; }
input.filter { padding: 7px 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; color: var(--text); font: inherit; font-size: 14px; outline: none; min-width: 220px; }
input.filter:focus { border-color: var(--accent2); }
details { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-top: 12px; }
details > summary { padding: 12px 16px; cursor: pointer; font-weight: 650; color: var(--text2); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 18px; color: var(--accent2); transition: transform 0.15s; }
details[open] > summary::before { transform: rotate(90deg); }
details > .in { padding: 0 16px 16px; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .tx { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .tip { position: absolute; pointer-events: none; background: rgba(10, 12, 6, 0.95); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 11px; font-size: 12px; white-space: nowrap; display: none; z-index: 3; box-shadow: 0 8px 24px #0009; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.gif { width: 100%; max-width: 520px; border-radius: 12px; border: 1px solid var(--line); background: #000; display: block; }
.md { max-width: 860px; color: var(--text2); }
.md h1 { font-size: 28px; color: var(--text); margin: 4px 0 18px; }
.md h2 { font-size: 20px; color: var(--text); margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
.md h3 { font-size: 16px; color: var(--cream); margin: 22px 0 8px; }
.md p, .md li { line-height: 1.72; }
.md strong { color: var(--text); }
.md table { margin: 12px 0; display: block; overflow-x: auto; }
.md img { max-width: 100%; max-height: 420px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 10px 0; }
.md blockquote { margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent2); background: var(--panel); border-radius: 0 10px 10px 0; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
mark { background: #5E5020; color: var(--cream); border-radius: 3px; padding: 0 2px; }
.doclayout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; }
/* the list scrolls on its own, independent of the document next to it */
.doclist { position: sticky; top: 86px; align-self: start; font-size: 14px; max-height: calc(100vh - 110px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.doclist .g { color: var(--accent2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 4px; font-weight: 700; cursor: pointer; user-select: none; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
.doclist .g:hover { background: var(--panel); }
.doclist .g::before { content: "▾"; font-size: 10px; transition: transform 0.15s; }
.doclist .g.shut::before { transform: rotate(-90deg); }
.doclist .g.shut + .items { display: none; }
.doclist .g .c { margin-left: auto; color: var(--muted); font-weight: 500; }
.doclist a { display: block; padding: 5px 10px; border-radius: 8px; color: var(--text2); }
.doclist a:hover { background: var(--panel); text-decoration: none; }
.doclist a.on { background: var(--panel2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
input[type="range"] { accent-color: var(--accent); width: 160px; vertical-align: middle; }
.speed { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
.speed b { min-width: 52px; display: inline-block; color: var(--text); }
td.pick { width: 34px; } td.pick label { display: grid; place-items: center; min-height: 36px; cursor: pointer; } td.pick input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; margin: 0; }
.cmpbar { position: sticky; bottom: 16px; z-index: 6; margin-top: 18px; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 14px; box-shadow: 0 10px 30px #000a; flex-wrap: wrap; }
.timeline { position: relative; display: grid; gap: 12px; }
.timeline::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: linear-gradient(var(--olive), var(--line)); }
.ph { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; position: relative; }
.ph .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); position: relative; }
.ph.done .num { background: #1C2612; color: var(--good); border-color: var(--olive); }
.ph.current .num { background: var(--accent); color: #1A1406; border-color: var(--accent); box-shadow: 0 0 0 6px rgba(201, 152, 47, 0.16); }
.ph.upcoming { opacity: 0.86; } /* still readable: muted text stays above 4.5:1 contrast */
.steps { display: flex; gap: 6px; margin-top: 20px; }
.steps > div { flex: 1; text-align: center; }
.steps span { display: block; height: 6px; border-radius: 99px; background: var(--line2); }
.steps small { display: block; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
.steps .done span { background: var(--good); }
.steps .current span { background: linear-gradient(90deg, var(--accent), var(--accent-hi), var(--accent)); background-size: 200% 100%; animation: shimmer 2.4s linear infinite; }
.steps .current small { color: var(--accent-hi); font-weight: 750; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: 0 0; } }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.thumbs img { height: 90px; border-radius: 8px; border: 1px solid var(--line); }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: var(--radius); background: rgba(0, 0, 0, 0.12); }
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }
.toasts { position: fixed; right: 22px; bottom: 22px; z-index: 50; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { max-width: 400px; padding: 12px 16px; background: var(--panel2); border: 1px solid var(--accent2); border-radius: 14px; box-shadow: 0 12px 30px #000a; font-size: 14px; animation: toast 0.25s ease-out; pointer-events: auto; }
@keyframes toast { from { opacity: 0; transform: translateY(10px); } }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--text2); overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 2px 9px; margin: 2px 4px 2px 0; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line2); font-size: 12px; color: var(--text2); }
a.chip:hover { border-color: var(--accent2); text-decoration: none; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; border: 1px solid #6E5426; background: linear-gradient(90deg, #2C2210, #20190D); color: var(--warn); font-size: 14px; margin-bottom: 16px; }
.banner.bad { border-color: #6B3A30; background: linear-gradient(90deg, #2E1813, #22120E); color: var(--bad); }
.banner.good { border-color: var(--olive); background: linear-gradient(90deg, #1C2612, #161D0E); color: var(--good); }
.banner.info { border-color: var(--line2); background: var(--panel); color: var(--text2); }
.banner .t2 { color: var(--text2); }
.skel { border-radius: var(--radius); background: linear-gradient(90deg, var(--panel) 0%, var(--panel2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border: 1px solid var(--line); }

/* ---------- hero + mascot ---------- */
.hero { position: relative; overflow: hidden; background: radial-gradient(600px 300px at 85% 30%, rgba(201, 152, 47, 0.13), transparent 70%), linear-gradient(135deg, rgba(79, 91, 42, 0.6), var(--panel) 62%); border-color: #3E4925; padding: 24px 28px 22px; display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 10px 26px; align-items: center; }
.hello { font-size: 13px; color: var(--accent2); font-weight: 600; letter-spacing: 0.01em; margin-bottom: 10px; }
.hero h1 { font-size: 31px; margin-top: 12px; }
.say { position: relative; margin: 14px 0 0; padding: 11px 15px; border-radius: 14px; background: rgba(10, 13, 7, 0.55); border: 1px solid var(--line2); color: var(--text2); font-size: 14px; min-height: 46px; }
.say::after { content: ""; position: absolute; right: -8px; top: 50%; width: 14px; height: 14px; background: rgba(13, 16, 9, 0.98); border-right: 1px solid var(--line2); border-top: 1px solid var(--line2); transform: translateY(-50%) rotate(45deg); }
.say b { color: var(--text); }
.mascot { width: 100%; height: auto; overflow: visible; }
.mascot .j { transform-box: view-box; transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1); }
.mascot .j1 { transform-origin: 40px 86px; } .mascot .j2 { transform-origin: 40px 58px; } .mascot .j3 { transform-origin: 40px 34px; }
.mascot .zz { opacity: 0; font: 700 13px var(--sans); fill: var(--accent2); }
.mascot .tgt { transform-box: fill-box; transform-origin: center; }
.mascot.train .j1 { animation: a1 3.6s ease-in-out infinite; } .mascot.train .j2 { animation: a2 3.6s ease-in-out infinite; } .mascot.train .j3 { animation: a3 3.6s ease-in-out infinite; }
.mascot.train .tgt { animation: hit 3.6s ease-in-out infinite; }
@keyframes a1 { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(38deg); } }
@keyframes a2 { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(42deg); } }
@keyframes a3 { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(30deg); } }
@keyframes hit { 0%, 40%, 60%, 100% { transform: scale(1); } 50% { transform: scale(1.45); } }
.mascot.idle .j1 { transform: rotate(-15deg); } .mascot.idle .j2 { transform: rotate(120deg); } .mascot.idle .j3 { transform: rotate(50deg); }
.mascot.idle .tgt { opacity: 0.25; }
.mascot.idle .zz { animation: zz 3s ease-in infinite; } .mascot.idle .zz.b { animation-delay: 1.5s; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -26px); } }
.mascot.think .j1 { transform: rotate(4deg); } .mascot.think .j2 { transform: rotate(28deg); } .mascot.think .j3 { animation: tap 1.8s ease-in-out infinite; }
@keyframes tap { 0%, 100% { transform: rotate(40deg); } 50% { transform: rotate(70deg); } }
.mascot.worried .j1 { animation: shake 3s ease-in-out infinite; } .mascot.worried .j2 { transform: rotate(-35deg); } .mascot.worried .j3 { transform: rotate(-40deg); }
@keyframes shake { 0%, 14%, 100% { transform: rotate(0); } 2%, 6%, 10% { transform: rotate(-4deg); } 4%, 8%, 12% { transform: rotate(4deg); } }
.mascot.party .j1 { animation: none; transform: rotate(14deg); } .mascot.party .j2 { animation: none; transform: rotate(-12deg); } .mascot.party .j3 { animation: wave 0.5s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- live cards, numbers, activity ---------- */
.live-card .pct { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.nums .v { font-size: 24px; font-weight: 750; letter-spacing: -0.02em; color: var(--text); }
.nums .l { font-size: 12px; color: var(--muted); }
.feed { list-style: none; margin: 12px 0 0; padding: 0; }
.feed li { display: grid; grid-template-columns: max-content 18px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.feed li:first-child { border-top: 0; }
.feed .tm { white-space: nowrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feed li.new .tm { color: var(--accent-hi); font-weight: 700; }
.feed li.new .tm::after { content: " •"; }

/* ---------- laptop page ---------- */
.gauge { text-align: center; }
.gauge svg { width: 100%; max-width: 190px; height: auto; display: block; margin: 0 auto; }
.gauge .trk { stroke: var(--panel3); }
.gauge .val { transition: stroke-dashoffset 0.8s; }
.gauge .gv { font-size: 26px; font-weight: 750; margin-top: -40px; letter-spacing: -0.02em; }
.gauge .gv small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.gauge .gl { font-size: 13px; color: var(--text2); font-weight: 650; margin-top: 8px; }
.gauge .gs { font-size: 12px; color: var(--muted); }
.gate { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 12px; align-items: baseline; font-size: 13.5px; margin-top: 12px; }
.gate .k { color: var(--muted); }
.skip { position: absolute; left: 12px; top: -60px; z-index: 90; padding: 8px 14px; border-radius: 10px; background: var(--accent); color: #1A1406; font-weight: 700; }
.skip:focus { top: 12px; }
.cores { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.core { border-radius: 10px; padding: 8px 6px 6px; text-align: center; border: 1px solid var(--line2); background: color-mix(in oklab, var(--accent) var(--l), var(--panel2)); transition: background 0.6s; }
.core b { display: block; font-size: 15px; color: var(--text); text-shadow: 0 1px 2px #0008; }
.core small { font-size: 10.5px; color: var(--text2); opacity: 0.8; }
.who { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }

/* ---------- overlays + phone ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
.overlay .card { max-width: 440px; width: 100%; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; margin-top: 12px; }
.keys kbd { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 6px; background: var(--panel2); color: var(--cream); }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
nav.tabs, .more { display: none; }
@media (max-width: 1100px) { .gc2 { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; }
  .top { padding: 10px 14px; gap: 10px; }
  .top .brand { display: flex; }
  .top .brand > div { display: none; }
  .vit { padding: 6px 10px; gap: 8px; font-size: 12.5px; }
  .vit .cpu { display: none; }
  .offline { padding: 7px 14px; }
  main { padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; }
  .hero { display: block; padding: 18px 18px 16px; }
  .hero .mslot { position: absolute; top: 14px; right: 10px; width: 92px; }
  .hero .htop { padding-right: 86px; }
  .hero h1 { font-size: 24px; }
  .say::after { display: none; }
  .hero .steps small { font-size: 9.5px; }
  .doclayout { grid-template-columns: minmax(0, 1fr); } .doclist { position: static; max-height: 40vh; }
  .toasts { left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); align-items: stretch; }
  .toast { max-width: none; }
  nav.tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(12, 15, 8, 0.94); backdrop-filter: blur(14px); border-top: 1px solid var(--line2); }
  nav.tabs a, nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border: 0; background: none; color: var(--muted); font: 600 11px var(--sans); border-radius: 12px; cursor: pointer; }
  nav.tabs a:hover { text-decoration: none; }
  nav.tabs .ic { width: 21px; height: 21px; }
  nav.tabs .on { color: var(--accent-hi); background: rgba(79, 91, 42, 0.38); }
  .more:not([hidden]) { display: grid; position: fixed; right: 10px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 31; min-width: 220px; padding: 8px; gap: 2px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 16px 50px #000c; }
  .more a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: var(--text); font-weight: 560; }
  .more a .ic { color: var(--accent2); }
  /* phone: tooltips sit as a sheet above the tab bar, readable while the page scrolls */
  .term:hover::after, .term:focus::after { left: 16px; right: 16px; top: auto; bottom: calc(80px + env(safe-area-inset-bottom)); width: auto; max-width: none; }
  .results { position: fixed; left: 12px; right: 12px; top: 58px; }
  .more a:hover { background: var(--panel3); text-decoration: none; }
  .gauge .gv { font-size: 22px; }
  .cores { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .search input { padding-left: 36px; }
  .search input::placeholder { color: transparent; }
  .sec .r { margin-left: 0; }
  .card { padding: 16px; }
  table.runs { min-width: 0; } /* narrow() drops the Steps and ▶ columns */
  /* the decision log reads as a list on a phone: date and phase above each decision */
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; }
  table.stack tr:first-child { display: none; }
  table.stack tr { padding: 10px 4px; border-bottom: 1px solid var(--line); }
  table.stack td { border: 0; padding: 2px 6px; overflow-wrap: anywhere; }
  table.stack td:first-child, table.stack td:nth-child(2) { display: inline-block; }
}
</style>

<script>
"use strict";
if (!["127.0.0.1", "localhost"].includes(location.hostname)) document.documentElement.classList.add("remote");
// ---------- words explained (tooltips + the "Words explained" page) ----------
const GLOSS = {
  "run": "One attempt at training a brand-new neural network from scratch, with one config and one seed. Everything about it lives in runs/<run name>/.",
  "seed": "The random starting point of a run. The same setup is trained with 3 seeds; if all three agree, the result isn't luck.",
  "step": "One control tick: the network looks at the arm and sends one command. 25 steps = 1 second of simulated time.",
  "success rate": "Out of 100 test attempts with new random targets, how many ended with the arm's tip within 2 cm of the target.",
  "typical miss": "The median distance between the tip and the target at the end of a test attempt. Lower is better.",
  "test score during training": "Every 20k–50k steps, training pauses briefly and the current network is tested on 100 separate 'validation' targets. This draws the learning curve; the best point is the model that is kept.",
  "time to reach": "How long the arm takes to first get within 2 cm, averaged over the successful attempts.",
  "jerkiness": "How much the command changes from one step to the next. Lower = smoother, less jerky movement.",
  "energy": "Work done by the motors in one attempt (joules). Only measured when the network commands forces directly (torque modes).",
  "reward": "The score the network is trained to maximise. It's built from several terms (precision bonus, success bonus, penalties), each logged separately.",
  "SAC": "Soft Actor-Critic: a learning algorithm that keeps a big memory of past experience and reuses it. The main algorithm in this project.",
  "PPO": "Proximal Policy Optimisation: a learning algorithm that learns only from fresh experience, usually from many simulators in parallel.",
  "HER": "Hindsight Experience Replay: replays a missed attempt as if the arm had been aiming where it actually ended up, so even misses teach something.",
  "IK": "Inverse kinematics: exact maths that turns a target position into the joint angles that reach it. No learning involved.",
  "action mode": "What the network's output means: nudge each joint a bit (delta_pos), jump to a joint angle (abs_pos), or push with a force (torque).",
  "gate": "The pass/fail checks a phase must meet before it counts as done (scripts/check_phase.py). Phase 4 has none on purpose: its numbers are results, not targets.",
  "checkpoint": "A saved copy of the network during training. model.zip = the best one on validation targets, final.zip = the last one.",
  "config": "The YAML file in configs/ that fully describes a run: task, robot, reward weights, algorithm and its settings.",
  "phase": "The project is split into 8 phases (0–7). Each one builds something, passes its gate, gets a report and a commit.",
  "dry run": "A tiny ~6k-step trial that runs before every real training job, only to catch crashes early. Hidden from this dashboard.",
  "reach": "Task A: move the arm's tip to a random target within 2 cm.",
  "hold": "Task B: reach the target and then stay still on it for the last 2 seconds.",
  "track": "Task C: keep the tip on a target that moves around a circle. Scored by the average distance to it after the first 2 seconds (step 50).",
  "obstacle": "Task D: reach the target with a box in the way. Any touch between the arm and the box counts as a bump (a collision).",
  "push": "Task E: a flat pad on the tip pushes a cube across the floor until the cube's centre is within 3 cm of a goal marker.",
  "bumps": "Collision rate: out of 100 test attempts, how many touched the obstacle box at least once. Phase 5 allows at most 5%.",

async function loadExp(id) { const d = await api("/api/exp/" + encodeURIComponent(id)); if (route().arg !== id) return; detail.exp = d; detail.expId = id; pageExp(id); }
function pageExp(id) {
  if (detail.exp?.error && detail.expId === id) return mount([["h", lost(`No experiment called “${esc(id)}”.`, `<a href="#/exp">All experiments →</a>`)]]);
  if (!detail.exp || detail.exp.id !== id) return fetching(() => loadExp(id), skel(90, 120, 300));
  const e = detail.exp;
  const curves = e.arms.filter((a) => a.learns).map((a, i) => {
    const hs = a.seeds.map((s) => s.val || []).filter((h) => h.length);

    const n = Math.min(...hs.map((h) => h.length));
    const pts = [...Array(n).keys()].map((k) => { const v = hs.map((h) => h[k][1] * 100); const m = v.reduce((x, y) => x + y) / v.length; return [hs[0][k][0], m, Math.sqrt(v.reduce((x, y) => x + (y - m) ** 2, 0) / v.length)]; });
    return { name: `${a.plain}${hs.length < a.seeds.length ? ` (${hs.length} seed${hs.length > 1 ? "s" : ""} so far)` : ""}`, pts, band: true, color: COLORS[i % COLORS.length] };
  });
  const allDone = e.arms.every((a) => a.success);

  const ps = (x) => (x == null ? "–" : ms([x[0] * 100, x[1] * 100]) + "%");
  const sec = (a) => (a == null ? "–" : `${(a[0] / e.hz).toFixed(1)} s <span class="muted">± ${(a[1] / e.hz).toFixed(1)}</span>`);
  const rows = e.arms.map((a) => `<tr><td><b>${esc(a.plain)}</b><div class="tiny muted">${esc(a.label)}</div></td><td class="num"><b>${ps(a.success)}</b></td><td>${a.seeds.map((s) => s.id ? `<a class="chip" href="#/run/${s.id}">seed ${s.seed}: ${s.eval ? pct(s.eval.success_rate) : s.status === "training" ? `● ${pct(s.steps / (s.total || 1))}` : esc(s.status)}</a>` : `<span class="chip">seed ${s.seed}: not started</span>`).join("")}</td><td class="num">${a.miss_mm ? ms(a.miss_mm, (v) => v.toFixed(1)) + " mm" : "–"}</td><td class="num">${sec(a.steps_to_success)}</td><td class="num">${a.smoothness ? ms(a.smoothness, (v) => v.toFixed(3)) : "–"}</td><td class="num">${a.energy ? ms(a.energy, (v) => v.toFixed(0)) + " J" : '<span class="muted" title="Only measured when the network commands motor forces (torque modes)">not measured</span>'}</td></tr>`).join("");
  const budgets = [...new Set(e.arms.map((a) => (a.learns ? ksteps(a.steps) + " steps" : "no training")))].join(" / ");
  mount([
    ["h", `<a class="small" href="#/exp">← all experiments</a><h1 style="margin-top:12px"><span style="color:var(--accent)">${esc(e.id.slice(0, 2).toUpperCase())}</span> · ${esc(e.question)}</h1><p class="t2" style="max-width:780px">${esc(e.why)}</p>`],
    ["verdict", verdict],
    ["chart", `<div class="sec"><h2>Learning curves</h2><span class="hint">${tip("test score during training")}, mean of the seeds; the shaded band is the spread between seeds</span></div><p class="tiny muted" style="margin:-6px 0 10px">The curve is measured on 100 validation targets, the final test below on a different fixed set of 100, so the curve's last point and the table can differ (for PPO by a lot: it handles some regions of the workspace far worse than others).</p><div class="card">${curves.length ? chart(curves, { y0: 0, y1: 100, yf: (v) => v.toFixed(0) + "%", legend: true, empty: "Curves appear after the first test, 20k steps into training." }) : `<p class="muted">This experiment compares finished policies; there is no learning curve for the IK controller.</p>`}</div>`],
    ["table", `<div class="sec"><h2>Final test</h2><span class="hint">100 attempts per seed, new random targets; mean ± spread over seeds</span></div><div class="card tablewrap"><table><tr><th>Setup</th><th>${tip("success rate", "Success")}</th><th>Per ${tip("seed", "seed")} (click to open)</th><th>${tip("typical miss", "Typical miss")}</th><th>${tip("time to reach", "Time to reach")}</th><th>${tip("jerkiness", "Jerkiness")}</th><th>${tip("energy", "Energy")}</th></tr>${rows}</table></div>`],
    ["meta", `<details data-k="setup"><summary>Exact setup (seeds, budget, configs)</summary><div class="in"><dl class="kv"><dt>Seeds</dt><dd>${[...new Set(e.arms.map((a) => a.seeds.map((s) => s.seed).join(", ")))].join(" / ")}</dd><dt>Step budget</dt><dd>${budgets} per run</dd><dt>Technical question</dt><dd>${esc(e.tech_question)}</dd>${e.arms.map((a) => `<dt>${esc(a.plain)}</dt><dd><code>${esc(a.config)}</code></dd>`).join("")}</dl><p class="tiny muted">The same numbers are written to <a href="#/doc/docs/results.md">docs/results.md</a> by <code>scripts/make_results.py</code> when the phase ends.</p></div></details>`],
  ]);
}

let runFilter = "count", runText = "";
function pageRuns() {

  const groups = [];

  const take = (title, hint, pred, shared, order, armOf) => { const g = list.filter((r) => (shared || !r._g) && pred(r)); if (!shared) g.forEach((r) => (r._g = 1)); if (order) g.sort((a, b) => order(a) - order(b) || a.seed - b.seed); if (g.length) groups.push([title, hint, g, armOf]); };

    take(`${tag}${e.plain}`, "Phase 4 experiment · one row per setup; click a setup to see its seeds", (r) => r.status !== "training" && arm(r) >= 0, true, arm, (r) => e.arms[arm(r)]);

  take(`Phase ${S.phase.current}: this phase's runs`, "pilots and attempts since the phase started", (r) => S.phase.runs.includes(r.id));
  take("Archive", "earlier attempts, tuning sweeps and pilots: kept for the record", () => true);

    <div class="row" style="margin-top:16px"><div class="filters">${[["count", "Important"], ["phase", "This phase"], ["training", "Training"], ["all", `All (${S.runs.length})`]].map(([k, l]) => `<button class="${runFilter === k ? "on" : ""}" onclick="runFilter='${k}';render()">${l}</button>`).join("")}</div><span class="sp"></span><input class="filter" id="runq" placeholder="Filter runs…" oninput="runText=this.value;pageRuns()"></div>

// ---------- docs ----------
function md(text, path) {
  const dir = path.split("/").slice(0, -1).join("/");
  const el = document.createElement("div");
  el.innerHTML = marked.parse(text.replace(/<!--[\s\S]*?-->/g, ""));
  const resolve = (src) => new URL(src, "http://x/" + (dir ? dir + "/" : "")).pathname.slice(1);
  el.querySelectorAll("img").forEach((i) => { const s = i.getAttribute("src"); if (s && !/^(https?:|data:|\/)/.test(s)) i.src = "/file/" + resolve(s); i.loading = "lazy"; });
  el.querySelectorAll("a").forEach((a) => { const h = a.getAttribute("href"); if (h && /^\s*javascript:/i.test(h)) a.removeAttribute("href"); if (h && /\.md(#.*)?$/.test(h) && !/^https?:/.test(h)) a.href = "#/doc/" + resolve(h.replace(/#.*/, "")); else if (h && /^https?:/.test(h)) a.target = "_blank"; });
  el.querySelectorAll("table").forEach((t) => t.classList.add("tablewrap"));
  el.querySelectorAll("h2").forEach((h, i) => (h.id = "h" + i));
  el.querySelectorAll("td").forEach((td) => { const v = td.textContent.trim(); if (v === "PASS" || v === "FAIL") td.innerHTML = `<span class="pill ${v}">${v}</span>`; });
  return el.innerHTML;
}
function inline(s) { return marked.parseInline(esc(s).replace(/&#39;/g, "'").replace(/&quot;/g, '"')).replace(/href="\s*javascript:[^"]*"/gi, 'href="#"'); }
// collapsible groups in the doc list; which ones are shut is remembered per browser
const SHUT = new Set(store.get("shut", []));
function toggleGroup(el) { const g = el.dataset.g; SHUT.has(g) ? SHUT.delete(g) : SHUT.add(g); store.set("shut", [...SHUT]); el.classList.toggle("shut"); }
function navGroup(name, items) { return `<div class="g${SHUT.has(name) ? " shut" : ""}" data-g="${esc(name)}" onclick="toggleGroup(this)">${esc(name)}<span class="c">${items.length}</span></div><div class="items">${items.join("")}</div>`; }
function docNav(cur) {
  const groups = {};

  const list = S.decisions.filter((d) => (decPhase === "all" || d.phase === decPhase) && (!t || (d.what + d.why).toLowerCase().includes(t))).slice().reverse();
  mount([
    ["h", `<h1>Decisions</h1><p class="t2">Claude's engineering log: every technical choice it made, with its reason, newest first. It's written for developers; the results themselves are on the Experiments and Runs pages. Source: <a href="#/doc/docs/decisions.md">docs/decisions.md</a>.</p><div class="row" style="margin-top:14px"><div class="filters">${["all", ...phasesList].map((p) => `<button class="${decPhase === p ? "on" : ""}" data-p="${esc(p)}" onclick="decPhase=this.dataset.p;$('#main').dataset.keys='';render()">${p === "all" ? "All" : p === "-" ? "General" : /^\d+$/.test(p) ? "Phase " + esc(p) : esc(p)}</button>`).join("")}</div><span class="sp"></span><input class="filter" id="decq" placeholder="Filter decisions…" oninput="decText=this.value;pageDecisions()"></div>`],
    ["list", list.length ? `<div class="card tablewrap" style="margin-top:16px;padding:6px 8px"><table class="stack"><tr><th style="width:110px">Date</th><th style="width:96px">Phase</th><th>Decision</th><th>Why</th></tr>${list.map((d) => `<tr><td class="muted small">${esc(d.date)}</td><td><span class="pill">${esc(d.phase)}</span></td><td class="small">${inline(d.what)}</td><td class="small muted">${inline(d.why)}</td></tr>`).join("")}</table></div>` : `<div class="empty" style="margin-top:16px">No decisions match.</div>`],
  ]);
  keepInput("#decq", decText);
}

// ---------- words explained ----------
function pageHelp() {
  mount([["h", `<h1>Words explained</h1><p class="t2">Every dotted-underlined word on this dashboard has a tooltip (tap it on a phone). Here they all are in one place.</p>`],
    ["l", `<div class="grid g2" style="margin-top:18px">${Object.entries(GLOSS).map(([k, v]) => `<div class="card"><h3 style="color:var(--cream)">${esc(k)}</h3><p class="t2 small" style="margin:6px 0 0">${esc(v)}</p></div>`).join("")}</div>`]]);
}

// ---------- search ----------
let qTimer = null, qSel = -1, qHits = [];
const hitHref = (h) => (h.kind === "doc" ? `#/doc/${h.path}` : h.kind === "run" ? `#/run/${h.id}` : "#/decisions");
$("#q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => doSearch(e.target.value), 180); });
$("#q").addEventListener("keydown", (e) => {
  const box = $("#qres");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); qSel = Math.max(0, Math.min(qHits.length - 1, qSel + (e.key === "ArrowDown" ? 1 : -1))); box.querySelectorAll("a").forEach((a, i) => a.classList.toggle("sel", i === qSel)); }
  if (e.key === "Enter") { const h = qHits[qSel]; if (h) openHit(h); else if (e.target.value.trim()) { location.hash = "#/search/" + encodeURIComponent(e.target.value.trim()); box.hidden = true; } }
  if (e.key === "Escape") { box.hidden = true; e.target.blur(); }
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("#qres").hidden = true; if (!e.target.closest("#more, #morebtn")) $("#more").hidden = true; });
function openHit(h) { $("#qres").hidden = true; if (h.kind === "doc") detail.hlNext = $("#q").value.trim(); if (h.kind === "decision") decText = $("#q").value.trim(); location.hash = hitHref(h); }
async function doSearch(q) {
  const box = $("#qres");
  if (q.trim().length < 2) { box.hidden = true; return; }
  qHits = await api("/api/search?q=" + encodeURIComponent(q)); qSel = -1;
  box.innerHTML = qHits.length ? qHits.slice(0, 12).map((h, i) => `<a href="${hitHref(h)}" data-i="${i}"><div class="k">${esc(h.kind)} · ${esc(h.title)}</div><div class="t">${esc(h.text)}</div></a>`).join("") + (qHits.length > 12 ? `<a href="#/search/${encodeURIComponent(q)}"><div class="t">All ${qHits.length} results →</div></a>` : "") : `<a><div class="t">Nothing found.</div></a>`;
  box.querySelectorAll("a[data-i]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); openHit(qHits[+a.dataset.i]); }));
  box.hidden = false;
}
async function pageSearch(q) {
  const hits = detail.search?.q === q ? detail.search.hits : null;
  if (!hits) { mount([["h", `<p class="muted">Searching…</p>`]]); const h = await api("/api/search?q=" + encodeURIComponent(q)); detail.search = { q, hits: h }; if (route().arg !== q) return; return pageSearch(q); }
  mount([["h", `<h1>Search: “${esc(q)}”</h1><p class="muted">${plural(hits.length, "result")}${hits.length >= 80 ? " (first 80)" : ""}</p>`],
    ["l", hits.length ? `<div class="card" style="padding:6px 8px">${hits.map((h) => `<a href="${hitHref(h)}" data-q="${esc(q)}" onclick="detail.hlNext=this.dataset.q" style="display:block;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)"><div class="tiny" style="color:var(--accent2);text-transform:uppercase;letter-spacing:.06em">${esc(h.kind)} · ${esc(h.title)}</div><div class="small t2">${esc(h.text)}</div></a>`).join("")}</div>` : `<div class="empty"><span class="big">🔍</span>Nothing found.</div>`]]);
}
// filter inputs live in blocks that never re-render while typing; restore their text after a page switch
function keepInput(sel, val) { const el = $("#main").querySelector(sel); if (el && document.activeElement !== el && el.value !== val) el.value = val; }

// ---------- keyboard shortcuts + phone menu ----------
const GO = { n: "#/", r: "#/runs", p: "#/phases", e: "#/exp", l: "#/laptop", d: "#/docs", c: "#/decisions", w: "#/help" };
let gWait = 0;
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "?") showKeys();
  else if (e.key === "Escape") document.querySelector(".overlay")?.remove();
  else if (e.key === "g") gWait = Date.now();
  else if (Date.now() - gWait < 1200 && GO[e.key]) { location.hash = GO[e.key]; gWait = 0; }
});
function showKeys() {
  if (document.querySelector(".overlay")) return;
  const o = document.createElement("div"); o.className = "overlay"; o.onclick = (e) => { if (e.target === o) o.remove(); };
  o.innerHTML = `<div class="card"><div class="row"><h3>Keyboard shortcuts</h3><span class="sp"></span><button class="btn sm" onclick="this.closest('.overlay').remove()">Close</button></div><div class="keys"><span><kbd>/</kbd></span><span>search everything</span><span><kbd>g</kbd> <kbd>n</kbd></span><span>go to Now</span><span><kbd>g</kbd> <kbd>r</kbd></span><span>Runs</span><span><kbd>g</kbd> <kbd>p</kbd></span><span>Phases</span><span><kbd>g</kbd> <kbd>e</kbd></span><span>Experiments</span><span><kbd>g</kbd> <kbd>l</kbd></span><span>Laptop</span><span><kbd>g</kbd> <kbd>d</kbd></span><span>Docs</span><span><kbd>g</kbd> <kbd>c</kbd></span><span>Claude's decisions</span><span><kbd>g</kbd> <kbd>w</kbd></span><span>Words explained</span><span><kbd>?</kbd></span><span>this list</span><span><kbd>Esc</kbd></span><span>close</span></div></div>`;
  document.body.append(o);
}
function toggleMore(e) { e.stopPropagation(); $("#more").hidden = !$("#more").hidden; }

// the phone's offline copy (sw.js; needs https or localhost), and a first paint from it while the laptop answers
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => { /* not allowed here: no offline copy */ });
if (window.caches) caches.match("/api/state").then((r) => r && r.json().then((d) => { if (!S) adopt(d, +r.headers.get("x-saved"), true); })).catch(() => { /* none yet */ });
try { localStorage.removeItem("rlarm.badges"); } catch { /* storage off */ } // milestones are gone
schedule();
poll();
</script>
</body>
</html>
